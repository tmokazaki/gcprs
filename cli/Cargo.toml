[package]
name = "cli"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = []
text = ["lindera"]

[dependencies]
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
csv = "1.4.0"
clap = { version = "^4", features = ["derive"] }
anyhow = { version = "^1.0", features = ["backtrace"] }
tokio = { version = "^1.54", features = ["full"] }
tabled = { version = "0.22", features = ["macros"], default-features = false }
json_to_table = "0.14"
url = "^2"

gcprs = { path = "../", features = ["full"] }
datafusion = "56.0.0"
thiserror = "2.0.21"
object_store = { version = "^0.14", features = ["gcp"] }
datafusion-common = "56.0.0"
datafusion-expr = "56.0.0"
linfa = { version = "0.9.0", features = ["serde", "ndarray-linalg"] }
linfa-clustering = { version = "0.9.0", features = ["ndarray-linalg", "serde"] }
ndarray = { version = "0.16.1", features = ["rayon", "serde"] }
linfa-nn = { version = "0.9.0", features = ["serde"] }
plotly = { version = "0.14.1", features = ["kaleido"] }
lindera = { version = "7.0.0", features = ["embed-ipadic"], optional = true }
